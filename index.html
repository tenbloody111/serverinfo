<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedrock Ping Checker</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #22c55e;
    --accent-dim: #16a34a;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --danger: #ef4444;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px calc(100px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 {
    font-size: 1.3rem;
    text-align: center;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    font-size: 0.95rem;
    margin-bottom: 14px;
  }
  input:focus { outline: 2px solid var(--accent); }
  select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    font-size: 0.9rem;
  }
  select:focus { outline: 2px solid var(--accent); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #04210f;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:active { background: var(--accent-dim); }
  button:disabled { opacity: 0.5; }

  /* Tombol Ping dengan garis progress di bawah teks */
  #pingBtn { transition: background 0.15s ease; }
  .btn-inner {
    display: inline-flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }
  .btn-progress {
    display: none;
    height: 4px;
    min-width: 120px;
    border-radius: 999px;
    background: rgba(4, 33, 15, 0.22);
    overflow: hidden;
  }
  .btn-progress-fill {
    display: block;
    height: 100%;
    width: 0%;
    background: #04210f;
    border-radius: 999px;
    transition: width 0.2s linear;
  }
  #pingBtn.loading {
    opacity: 1;
    background: var(--accent-dim);
    cursor: progress;
    padding-top: 7px;
    padding-bottom: 7px;
  }
  #pingBtn.loading .btn-progress { display: block; }
  #result { display: none; transition: opacity 0.15s ease; }
  #result.refreshing { opacity: 0.55; }
  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
  }
  .dot.offline { background: var(--danger); }
  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .info-row:last-child { border-bottom: none; }
  .info-row span:first-child { color: var(--muted); }
  .error-box {
    color: var(--danger);
    font-size: 0.9rem;
    text-align: center;
    padding: 8px 0;
  }
  .backend-box {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .backend-box-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .backend-box-header label { margin-bottom: 0; }
  .indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
  }
  .indicator .dot {
    width: 8px; height: 8px;
    box-shadow: 0 0 6px var(--accent);
  }
  .indicator .dot.offline {
    box-shadow: 0 0 6px var(--danger);
  }
  .panel { display: none; }
  .panel.active { display: block; }

  .tabbar {
    position: fixed;
    left: 50%;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 428px;
    display: flex;
    gap: 6px;
    background: rgba(30, 41, 59, 0.92);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    z-index: 50;
  }
  .tabbar button {
    flex: 1;
    background: transparent;
    color: var(--muted);
    font-weight: 600;
    padding: 12px;
    border-radius: 11px;
    transition: background 0.15s ease;
  }
  .tabbar button.active {
    background: var(--accent);
    color: #04210f;
  }

  .slider-row { margin-bottom: 16px; }
  .slider-row label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .slider-row label span:last-child {
    color: var(--accent);
    font-weight: 700;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    margin-bottom: 0;
    padding: 0;
    height: 28px;
  }
  .slider-hint {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .realtime-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding: 8px 10px;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .realtime-row .rt-label {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .realtime-row .rt-label span:first-child {
    font-size: 0.85rem;
    color: var(--text);
    font-weight: 600;
  }
  .realtime-row .rt-label span:last-child {
    font-size: 0.68rem;
    color: var(--muted);
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 38px;
    height: 22px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider-track {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: var(--border);
    border-radius: 999px;
    transition: 0.15s;
  }
  .switch .slider-track::before {
    content: "";
    position: absolute;
    height: 16px; width: 16px;
    left: 3px; bottom: 3px;
    background: #fff;
    border-radius: 50%;
    transition: 0.15s;
  }
  .switch input:checked + .slider-track {
    background: var(--accent);
  }
  .switch input:checked + .slider-track::before {
    transform: translateX(16px);
  }

  /* ===== Console ===== */
  .console-card { padding: 14px; }
  .console-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .console-title { min-width: 0; }
  .console-title h2 {
    font-size: 0.95rem;
    margin: 0 0 3px;
    white-space: nowrap;
  }
  .console-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    color: var(--muted);
  }
  .live-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .console-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn-small {
    width: auto;
    min-height: 40px;
    padding: 0 14px;
    font-size: 0.82rem;
    background: var(--border);
    color: var(--text);
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .btn-small:active { background: #475569; }
  .btn-icon { width: 40px; padding: 0; font-size: 1.05rem; }
  .btn-stop { background: var(--danger); color: #fff; }
  .btn-stop:active { background: #b91c1c; }

  .console-wrap { position: relative; }
  .console-box {
    background: #05080f;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 0;
    height: 58vh;
    height: 58dvh;
    min-height: 260px;
    max-height: 560px;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 0.74rem;
    line-height: 1.45;
  }
  .log-line {
    display: flex;
    gap: 8px;
    padding: 3px 10px 3px 8px;
    border-left: 3px solid transparent;
    color: #cbd5e1;
  }
  .log-time {
    flex: none;
    color: #64748b;
    font-variant-numeric: tabular-nums;
  }
  .log-msg {
    min-width: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .log-line.ok { color: #4ade80; }
  .log-line.err {
    color: #f87171;
    border-left-color: #ef4444;
    background: rgba(239, 68, 68, 0.08);
  }
  .log-line.warn {
    color: #fbbf24;
    border-left-color: #f59e0b;
    background: rgba(245, 158, 11, 0.08);
  }
  .log-line.sep {
    color: #38bdf8;
    border-left-color: #38bdf8;
    font-weight: 600;
    margin-top: 6px;
  }
  .log-line.sep:first-child { margin-top: 0; }
  .console-empty {
    color: var(--muted);
    text-align: center;
    padding: 40px 16px;
    font-size: 0.8rem;
    line-height: 1.6;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  .console-empty.err-text { color: #f87171; }

  .jump-bottom {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 38px;
    height: 38px;
    padding: 0;
    border-radius: 50%;
    background: var(--accent);
    color: #04210f;
    font-size: 1.1rem;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    opacity: 0;
    pointer-events: none;
    transform: translateY(6px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .jump-bottom.show { opacity: 1; pointer-events: auto; transform: none; }

  /* Console fullscreen */
  .console-card.fullscreen {
    position: fixed;
    inset: 0;
    height: 100vh;
    height: 100dvh;
    z-index: 100;
    margin: 0;
    border-radius: 0;
    border: none;
    display: flex;
    flex-direction: column;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .console-card.fullscreen .console-wrap { flex: 1; min-height: 0; }
  .console-card.fullscreen .console-box {
    height: 100%;
    max-height: none;
    min-height: 0;
    font-size: 0.8rem;
  }
  body.no-scroll { overflow: hidden; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏓 Bedrock Ping Checker</h1>
  <div class="subtitle">Cek status server Minecraft Bedrock</div>

  <div class="card backend-box">
    <div class="backend-box-header">
      <label for="backend">Alamat backend (Termux)</label>
      <div class="indicator">
        <div class="dot" id="backendDot"></div>
        <span id="backendStatusText">Mengecek...</span>
      </div>
    </div>
    <input id="backend" value="http://127.0.0.1:3000" placeholder="http://192.168.x.x:3000" oninput="onBackendChanged()">
  </div>

  <div id="panel-ping" class="panel active">
    <div class="card">
      <div class="row">
        <div>
          <label for="host">Host / IP Server</label>
          <input id="host" placeholder="play.example.net">
        </div>
        <div style="flex: 0 0 100px;">
          <label for="port">Port</label>
          <input id="port" value="19132">
        </div>
      </div>
      <div class="slider-row">
        <label for="packetCount"><span>Jumlah Packet</span><span id="packetCountVal">3</span></label>
        <input type="range" id="packetCount" min="0" max="10" value="3" oninput="document.getElementById('packetCountVal').textContent = this.value">
        <div class="slider-hint">
          <span>0 = info ringan</span>
          <span>10 = packet asli terbanyak</span>
        </div>
      </div>

      <div style="margin-bottom: 14px;">
        <label for="timeoutSelect">Timeout / Latensi Jaringan</label>
        <select id="timeoutSelect">
          <option value="3000" selected>Cepat (~3 detik)</option>
          <option value="30000">30 Detik</option>
          <option value="60000">1 Menit</option>
          <option value="120000">2 Menit</option>
        </select>
      </div>

      <div class="realtime-row">
        <div class="rt-label">
          <span>Mode Realtime</span>
          <span>Perbarui status tiap 1 detik</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="realtimeToggle" onchange="toggleRealtime()">
          <span class="slider-track"></span>
        </label>
      </div>

      <button id="pingBtn" onclick="doPing()">
        <span class="btn-inner">
          <span id="pingBtnLabel">Ping Server</span>
          <span class="btn-progress"><span class="btn-progress-fill" id="progressFill"></span></span>
        </span>
      </button>
    </div>

    <div class="card" id="result">
      <div class="status-line">
        <div class="dot" id="statusDot"></div>
        <strong id="statusText">-</strong>
      </div>
      <div id="infoBox"></div>
    </div>
  </div>

  <div id="panel-console" class="panel">
    <div class="card console-card" id="consoleCard">
      <div class="console-header">
        <div class="console-title">
          <h2>🖥️ Console</h2>
          <div class="console-meta"><span class="live-dot"></span><span id="logCount">0 baris</span></div>
        </div>
        <div class="console-actions">
          <button class="btn-small btn-stop" onclick="stopBackend()" title="Hentikan ping yang sedang berjalan" aria-label="Stop">⏹ Stop</button>
          <button class="btn-small btn-icon" id="fullscreenBtn" onclick="toggleConsoleFullscreen()" title="Perbesar console" aria-label="Perbesar console">⛶</button>
          <button class="btn-small btn-icon" onclick="clearLogs()" title="Bersihkan log" aria-label="Bersihkan log">🗑</button>
        </div>
      </div>
      <div class="console-wrap">
        <div class="console-box" id="consoleBox"><div class="console-empty">Menunggu aktivitas backend...</div></div>
        <button class="jump-bottom" id="jumpBottom" onclick="scrollConsoleToBottom(true)" aria-label="Ke log terbaru">↓</button>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <button id="tab-ping" class="active" onclick="switchTab('ping')">Cek Ping</button>
    <button id="tab-console" onclick="switchTab('console')">Console</button>
  </div>
</div>

<script>
let pingInFlight = false;
let pingController = null;
let userStopped = false;
let progressTimer = null;
let progressHideTimer = null;

function startProgress(packetCount, timeoutMs) {
  // Perkiraan waktu tunggu maksimum = jumlah packet x timeout per packet.
  // Kalau server membalas cepat, garis langsung lompat ke 100%.
  const maxMs = Math.max(1, packetCount) * timeoutMs;
  const btn = document.getElementById('pingBtn');
  const fill = document.getElementById('progressFill');
  const started = Date.now();

  clearInterval(progressTimer);
  clearTimeout(progressHideTimer);
  fill.style.transition = 'none';
  fill.style.width = '0%';
  void fill.offsetWidth; // paksa reflow supaya animasi mulai dari 0
  fill.style.transition = '';
  btn.classList.add('loading');

  progressTimer = setInterval(() => {
    const pct = Math.min(95, ((Date.now() - started) / maxMs) * 100);
    fill.style.width = pct + '%';
  }, 100);
}

function finishProgress(onDone) {
  clearInterval(progressTimer);
  progressTimer = null;
  document.getElementById('progressFill').style.width = '100%';
  progressHideTimer = setTimeout(onDone, 250);
}

async function doPing(isAuto) {
  if (pingInFlight) return; // cegah request numpuk, terutama saat mode realtime
  const backend = document.getElementById('backend').value.trim().replace(/\/$/, '');
  const host = document.getElementById('host').value.trim();
  const port = document.getElementById('port').value.trim() || '19132';
  const count = document.getElementById('packetCount').value || '1';
  const timeout = document.getElementById('timeoutSelect').value || '3000';
  const btn = document.getElementById('pingBtn');
  const label = document.getElementById('pingBtnLabel');
  const resultBox = document.getElementById('result');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const infoBox = document.getElementById('infoBox');
  const isRealtime = document.getElementById('realtimeToggle').checked;

  if (!host) {
    if (!isAuto) alert('Isi host/IP server dulu');
    return;
  }

  pingInFlight = true;
  userStopped = false;
  pingController = new AbortController();
  if (!isRealtime) {
    btn.disabled = true;
    label.textContent = 'Mengecek...';
  }
  const hadResult = resultBox.dataset.hasResult === '1';
  resultBox.style.display = 'block';
  if (hadResult) {
    // Data hasil sebelumnya tetap tampil sampai hasil baru datang (cukup diredupkan)
    if (!isRealtime) resultBox.classList.add('refreshing');
  } else if (!isAuto) {
    statusDot.className = 'dot';
    statusText.textContent = 'Mengecek...';
    infoBox.innerHTML = '';
  }
  // Progress bar hanya untuk ping manual (mode realtime update tiap 1 detik, jadi tidak perlu)
  if (!isRealtime) {
    startProgress(parseInt(count, 10) || 1, parseInt(timeout, 10) || 3000);
  }

  try {
    const res = await fetch(`${backend}/api/ping?host=${encodeURIComponent(host)}&port=${encodeURIComponent(port)}&count=${encodeURIComponent(count)}&timeout=${encodeURIComponent(timeout)}`, { signal: pingController.signal });
    const data = await res.json();
    const s = data.summary;

    if (data.cancelled) {
      if (hadResult) return; // dibatalkan: biarkan data sebelumnya tetap tampil
      statusDot.classList.add('offline');
      statusText.textContent = 'Dibatalkan';
      infoBox.innerHTML = `<div class="error-box">Pengecekan dihentikan oleh user.</div>`;
      return;
    }

    resultBox.dataset.hasResult = '1';

    if (!data.ok) {
      statusDot.classList.add('offline');
      statusText.textContent = 'Server offline / tidak merespon';
      infoBox.innerHTML = `
        <div class="error-box">${escapeHtml(data.error || 'Tidak diketahui')}</div>
        ${s ? `<div class="info-row"><span>Packet loss</span><span>${s.failed}/${s.sent} (${s.lossPercent}%)</span></div>` : ''}
      `;
      return;
    }

    statusDot.classList.remove('offline');
    statusText.textContent = 'Server online';
    const info = data.info;

    if (data.minimalMode) {
      // Mode info ringan: cuma status + latency
      infoBox.innerHTML = `
        <div class="info-row"><span>Latency</span><span>${s.avgLatency} ms</span></div>
      `;
    } else {
      infoBox.innerHTML = `
        <div class="info-row"><span>MOTD</span><span>${escapeHtml(info.motd || '-')}</span></div>
        <div class="info-row"><span>Versi</span><span>${escapeHtml(info.mcVersion || '-')}</span></div>
        <div class="info-row"><span>Player</span><span>${info.players || '0'} / ${info.maxPlayers || '0'}</span></div>
        <div class="info-row"><span>Gamemode</span><span>${escapeHtml(info.gamemode || '-')}</span></div>
        <div class="info-row"><span>World / Sub-MOTD</span><span>${escapeHtml(info.motd2 || '-')}</span></div>
        <div class="info-row"><span>Packet terkirim</span><span>${s.sent}</span></div>
        <div class="info-row"><span>Berhasil / Gagal</span><span>${s.success} / ${s.failed}</span></div>
        <div class="info-row"><span>Packet loss</span><span>${s.lossPercent}%</span></div>
        <div class="info-row"><span>Latency (min/avg/max)</span><span>${s.minLatency}/${s.avgLatency}/${s.maxLatency} ms</span></div>
      `;
    }
  } catch (e) {
    if (e.name === 'AbortError' || userStopped) {
      if (!hadResult) {
        statusDot.classList.add('offline');
        statusText.textContent = 'Dibatalkan';
        infoBox.innerHTML = `<div class="error-box">Pengecekan dihentikan oleh user.</div>`;
      }
    } else {
      resultBox.dataset.hasResult = '1';
      statusDot.classList.add('offline');
      statusText.textContent = 'Gagal menghubungi backend';
      infoBox.innerHTML = `<div class="error-box">${escapeHtml(e.message)} — pastikan server.js aktif di Termux dan alamat backend benar.</div>`;
    }
  } finally {
    pingInFlight = false;
    pingController = null;
    resultBox.classList.remove('refreshing');
    const resetBtn = () => {
      btn.classList.remove('loading');
      if (!document.getElementById('realtimeToggle').checked) {
        btn.disabled = false;
        label.textContent = 'Ping Server';
      }
    };
    // Ping manual: biarkan garis progress penuh sebentar sebelum tombol kembali normal
    if (!isRealtime) finishProgress(resetBtn); else resetBtn();
  }
}

let realtimeTimer = null;

function toggleRealtime() {
  const checked = document.getElementById('realtimeToggle').checked;
  const btn = document.getElementById('pingBtn');
  const label = document.getElementById('pingBtnLabel');
  const host = document.getElementById('host').value.trim();

  if (checked) {
    if (!host) {
      alert('Isi host/IP server dulu sebelum mengaktifkan mode realtime');
      document.getElementById('realtimeToggle').checked = false;
      return;
    }
    btn.disabled = true;
    label.textContent = 'Mode realtime aktif...';
    doPing(true);
    realtimeTimer = setInterval(() => doPing(true), 1000);
  } else {
    if (realtimeTimer) clearInterval(realtimeTimer);
    realtimeTimer = null;
    btn.disabled = false;
    label.textContent = 'Ping Server';
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let currentTab = 'ping';
let consolePollTimer = null;

async function stopBackend() {
  const backend = document.getElementById('backend').value.trim().replace(/\/$/, '');

  // Matikan mode realtime supaya ping tidak dimulai lagi
  const rt = document.getElementById('realtimeToggle');
  if (rt.checked) {
    rt.checked = false;
    toggleRealtime();
  }

  userStopped = true;
  try {
    await fetch(`${backend}/api/stop`);
  } catch (e) {
    // backend tidak terjangkau, tetap hentikan dari sisi UI
  }
  if (pingController) pingController.abort();
  if (currentTab === 'console') fetchLogs();
}

function setConsoleFullscreen(on) {
  const card = document.getElementById('consoleCard');
  const btn = document.getElementById('fullscreenBtn');
  const box = document.getElementById('consoleBox');
  card.classList.toggle('fullscreen', on);
  document.body.classList.toggle('no-scroll', on);
  btn.textContent = on ? '✕' : '⛶';
  btn.title = on ? 'Kecilkan console' : 'Perbesar console';
  requestAnimationFrame(() => {
    box.scrollTop = box.scrollHeight;
    updateJumpButton();
  });
}

function toggleConsoleFullscreen() {
  setConsoleFullscreen(!document.getElementById('consoleCard').classList.contains('fullscreen'));
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') setConsoleFullscreen(false);
});

function switchTab(tab) {
  currentTab = tab;
  if (tab !== 'console') setConsoleFullscreen(false);
  document.getElementById('panel-ping').classList.toggle('active', tab === 'ping');
  document.getElementById('panel-console').classList.toggle('active', tab === 'console');
  document.getElementById('tab-ping').classList.toggle('active', tab === 'ping');
  document.getElementById('tab-console').classList.toggle('active', tab === 'console');

  if (tab === 'console') {
    fetchLogs();
    if (!consolePollTimer) {
      consolePollTimer = setInterval(fetchLogs, 1500);
    }
  } else if (consolePollTimer) {
    clearInterval(consolePollTimer);
    consolePollTimer = null;
  }
}

let lastLogSig = null;

function classifyLog(msg) {
  if (/^---/.test(msg)) return 'sep';
  if (/error|gagal|timeout/i.test(msg)) return 'err';
  if (/dibatalkan|stop|memutus|dihentikan|dibersihkan/i.test(msg)) return 'warn';
  if (/berhasil|menerima|selesai|terkirim/i.test(msg)) return 'ok';
  return 'info';
}

function renderLogLine(line) {
  const m = line.match(/^\[([^\]]+)\]\s*(.*)$/);
  const time = m ? m[1] : '';
  const msg = m ? m[2] : line;
  return `<div class="log-line ${classifyLog(msg)}"><span class="log-time">${escapeHtml(time)}</span><span class="log-msg">${escapeHtml(msg)}</span></div>`;
}

function isConsoleAtBottom(box) {
  return box.scrollHeight - box.scrollTop - box.clientHeight < 24;
}

function updateJumpButton() {
  const box = document.getElementById('consoleBox');
  document.getElementById('jumpBottom').classList.toggle('show', !isConsoleAtBottom(box));
}

function scrollConsoleToBottom(smooth) {
  const box = document.getElementById('consoleBox');
  box.scrollTo({ top: box.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
}

document.getElementById('consoleBox').addEventListener('scroll', updateJumpButton, { passive: true });

async function fetchLogs() {
  const backend = document.getElementById('backend').value.trim().replace(/\/$/, '');
  const box = document.getElementById('consoleBox');
  const countEl = document.getElementById('logCount');
  try {
    const res = await fetch(`${backend}/api/logs`);
    const data = await res.json();
    const logs = data.logs || [];
    countEl.textContent = logs.length + ' baris';

    // Lewati render ulang kalau log tidak berubah (tidak berkedip, teks bisa diseleksi)
    const sig = logs.length + '|' + (logs[logs.length - 1] || '');
    if (sig === lastLogSig) return;
    lastLogSig = sig;

    const wasAtBottom = isConsoleAtBottom(box);
    if (logs.length === 0) {
      box.innerHTML = '<div class="console-empty">Belum ada aktivitas.<br>Lakukan "Cek Ping" untuk melihat log di sini.</div>';
    } else {
      box.innerHTML = logs.map(renderLogLine).join('');
    }
    if (wasAtBottom) box.scrollTop = box.scrollHeight;
    updateJumpButton();
  } catch (e) {
    lastLogSig = null;
    countEl.textContent = 'offline';
    box.innerHTML = `<div class="console-empty err-text">Tidak bisa mengambil log dari backend:<br>${escapeHtml(e.message)}</div>`;
  }
}

async function clearLogs() {
  const backend = document.getElementById('backend').value.trim().replace(/\/$/, '');
  try {
    await fetch(`${backend}/api/logs/clear`);
    fetchLogs();
  } catch (e) {
    alert('Gagal membersihkan log: ' + e.message);
  }
}

let healthPollTimer = null;
let healthDebounceTimer = null;

async function checkBackendHealth() {
  const backend = document.getElementById('backend').value.trim().replace(/\/$/, '');
  const dot = document.getElementById('backendDot');
  const text = document.getElementById('backendStatusText');

  if (!backend) {
    dot.classList.add('offline');
    text.textContent = 'Alamat kosong';
    return;
  }

  try {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 3000);
    const res = await fetch(`${backend}/api/health`, { signal: controller.signal });
    clearTimeout(t);
    if (res.ok) {
      dot.classList.remove('offline');
      text.textContent = 'Terhubung';
    } else {
      throw new Error('bad status');
    }
  } catch (e) {
    dot.classList.add('offline');
    text.textContent = 'Tidak terhubung';
  }
}

function onBackendChanged() {
  clearTimeout(healthDebounceTimer);
  healthDebounceTimer = setTimeout(checkBackendHealth, 500);
}

checkBackendHealth();
healthPollTimer = setInterval(checkBackendHealth, 5000);
</script>
